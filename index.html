<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament MLBB - Beranda</title>
  <link rel="icon" type="image/png" href="https://fav.luvtoberi.com/fav/favweb4d.webp">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
    body { background: #030712; color: #f3f4f6; min-height: 100vh; padding: 20px; }

    .container { max-width: 1100px; margin: 0 auto; display: flex; gap: 20px; }
    .main-content { flex: 1; background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .banner-wrapper { overflow: hidden; border-radius: 12px; border: 1px solid rgba(0, 242, 254, 0.2); }
    .banner-img { width: 100%; display: block; transition: transform 0.4s ease; }
    .banner-wrapper:hover .banner-img { transform: scale(1.02); }

    .sidebar-menu { width: 240px; background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; height: fit-content; }
    .menu-item { padding: 14px 18px; color: #9ca3af; font-weight: 700; font-size: 13px; border-radius: 10px; text-decoration: none; background: rgba(255,255,255,0.02); border: 1px solid transparent; transition: all 0.3s ease; letter-spacing: 0.5px; }
    .menu-item:hover, .menu-item.active { color: #ffffff; background: linear-gradient(90deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.05)); border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); transform: translateX(4px); }

    .cta-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .btn { flex: 1; padding: 14px; text-align: center; text-decoration: none; font-weight: 800; border-radius: 10px; font-size: 14px; letter-spacing: 1px; transition: all 0.3s ease; text-transform: uppercase; }
    .btn-login { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #030712; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3); }
    .btn-login:hover { box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5); transform: translateY(-2px); }
    .btn-daftar { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn-daftar:hover { box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); transform: translateY(-2px); }

    @media (max-width: 768px) { .container { flex-direction: column; } .sidebar-menu { width: 100%; order: -1; } }
  </style>
</head>
<body>

  <div class="container">
    <div class="main-content">
      <div class="banner-wrapper">
        <img class="banner-img" src="https://i.ibb.co/kg9qtctS/image.png" alt="Banner Turnamen">
      </div>
      <div class="cta-buttons">
        <a href="http://wadahsuix.com/" target="_blank" class="btn btn-login">Masuk / Login</a>
        <a href="http://wadahsuix.com/" target="_blank" class="btn btn-daftar">Daftar Sekarang</a>
      </div>
    </div>

    <div class="sidebar-menu">
      <a href="/index.html" class="menu-item active">BERANDA</a>
      <a href="/tim.html" class="menu-item">TIM PARTICIPANT</a>
      <a href="/jadwal.html" class="menu-item">JADWAL MATCH</a>
      <a href="/prizepool.html" class="menu-item">PRIZEPOOL</a>
      <a href="/rules.html" class="menu-item">RULES TURNAMEN</a>
    </div>
  </div>

</body>
</html>
